spring:
  application:
    name: sentra
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:55432/sentra}
    username: ${DB_USER:sentra}
    password: ${DB_PASSWORD:devpass}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

sentra:
  ssrf:
    # Only for local demos against localhost; must stay false anywhere reachable from the internet.
    allow-private: ${SSRF_ALLOW_PRIVATE:false}
  scheduler:
    tick-ms: ${SCHEDULER_TICK_MS:5000}
    batch-size: ${SCHEDULER_BATCH_SIZE:50}
    pool-size: ${SCHEDULER_POOL_SIZE:10}
  jwt:
    # No default on purpose: startup fails unless JWT_SECRET is set (or the dev profile is active).
    secret: ${JWT_SECRET}
    expiry-minutes: ${JWT_EXPIRY_MINUTES:60}
