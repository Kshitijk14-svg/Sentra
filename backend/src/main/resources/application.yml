spring:
  application:
    name: sentra
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:55432/sentra}
    username: ${DB_USER:sentra}
    password: ${DB_PASSWORD:devpass}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

sentra:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-before-deploying-1234567890}
    expiry-minutes: ${JWT_EXPIRY_MINUTES:60}
